<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesan EA Dimsum</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --gelap: #4A2D17; --kayu: #7A4A25; --terang: #9A6431;
    --bg: #FBF9F6; --teks: #2B1B10; --garis: #E8DDD0; --redup: #6F5C4C;
    --krem: #F1E6D8; --hijau: #17684D; --merah: #A32A1F;
    --grad: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0, rgba(255,255,255,.05) 2px, transparent 2px, transparent 9px), linear-gradient(135deg, #4A2D17, #7A4A25 55%, #9A6431);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--teks); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.4; }
  button, input { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }
  body { background: radial-gradient(1200px 500px at 50% -120px, #F3E4D0, transparent 70%), var(--bg); }
  .wrap { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .wrap.wide { max-width: 1180px; }
  .hero { background: var(--grad); color: #fff; padding: 30px 20px 26px; border-radius: 0 0 24px 24px; margin-bottom: 12px; position: relative; overflow: hidden; box-shadow: 0 6px 18px rgba(74,45,23,.18); }
  .hero::after { content: '🥟'; position: absolute; right: 14px; bottom: -14px; font-size: 92px; opacity: .16; transform: rotate(-12deg); pointer-events: none; }
  .hero .brand { font-size: 12px; font-weight: 700; letter-spacing: .14em; opacity: .9; }
  .hero h1 { margin: 4px 0; font-size: 26px; line-height: 1.2; font-weight: 800; }
  .hero p { margin: 0; opacity: .92; }
  .shop { display: block; }
  .side { display: none; }
  .pad { padding: 4px 20px 12px; }
  .redup { color: var(--redup); }
  .center { text-align: center; }
  .err { color: var(--merah); font-weight: 600; margin: 0 0 8px; }
  .chips { display: flex; gap: 8px; padding: 4px 20px 12px; overflow-x: auto; }
  .chip { flex: none; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #DCCDBB; background: #fff; color: var(--teks); font-weight: 600; }
  .chip.on { background: var(--kayu); border-color: var(--kayu); color: #fff; }
  .list { flex: 1; padding: 0 20px 12px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: #fff; border: 1px solid var(--garis); border-radius: 16px; padding: 12px; box-shadow: 0 1px 2px rgba(74,45,23,.05); }
  .item { display: flex; gap: 12px; align-items: center; }
  .item.off { opacity: .55; }
  .foto { width: 76px; height: 76px; flex: none; border-radius: 12px; background: linear-gradient(135deg, #F6EBDC, #E8D3B8); font-size: 38px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .foto .tag { position: absolute; left: 6px; top: 6px; background: var(--merah); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .info { flex: 1; min-width: 0; }
  .nama { font-weight: 700; }
  .ket { color: var(--redup); font-size: 12px; }
  .harga { font-weight: 800; margin-top: 4px; color: var(--kayu); font-size: 15px; }
  .ctl { width: 116px; flex: none; display: flex; justify-content: flex-end; }
  .item { transition: box-shadow .15s, transform .15s; }
  .btn-add { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--kayu); background: #fff; color: var(--kayu); font-weight: 700; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DCCDBB; background: #fff; font-size: 20px; color: var(--teks); }
  .qbtn.plus { border: 0; background: var(--kayu); color: #fff; }
  .qnum { min-width: 18px; text-align: center; font-weight: 700; }
  .habis { font-weight: 700; color: var(--merah); }
  .bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--garis); padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .btn { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--grad); color: #fff; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; }
  .btn.solo { justify-content: center; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn-ghost { min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--kayu); background: #fff; color: var(--kayu); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .top { display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px; }
  .top h1 { margin: 0; font-size: 18px; font-weight: 800; }
  .link { min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--kayu); font-weight: 700; }
  .body { flex: 1; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .lines { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-weight: 700; display: block; margin-bottom: 6px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text], input[type=tel] { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #DCCDBB; background: #fff; color: var(--teks); font-size: 15px; }
  .note { color: var(--redup); font-size: 13px; margin: 6px 0 0; }
  .box { background: var(--krem); border-radius: 12px; padding: 12px 14px; }
  .total { font-weight: 800; font-size: 16px; }
  .queue { background: var(--grad); color: #fff; border-radius: 16px; padding: 18px 20px; }
  .queue .no { font-size: 36px; font-weight: 800; line-height: 1.1; }
  .queue .sub { margin-top: 6px; opacity: .92; }
  .steps { display: flex; flex-direction: column; gap: 14px; }
  .step { display: flex; align-items: center; gap: 12px; }
  .dot { width: 18px; height: 18px; flex: none; border-radius: 9px; border: 2px solid #D9CBB9; background: #fff; }
  .step.done .dot { background: var(--hijau); border-color: var(--hijau); }
  .step.now .dot { border-color: var(--kayu); }
  .step .t { flex: 1; color: var(--redup); }
  .step.done .t, .step.now .t { color: var(--teks); font-weight: 700; }
  .step .s { font-size: 12px; color: var(--redup); }
  .banner { border-radius: 12px; padding: 12px 14px; font-weight: 600; }
  .banner.bad { background: #F8DAD6; color: #7E1A12; }
  .banner.info { background: #FFF4DB; color: #5C3A00; }
  .banner.good { background: #D5EDE3; color: #0E4F39; }
  .struk { display: flex; flex-direction: column; gap: 12px; padding: 18px; }
  .struk .judul { text-align: center; }
  .struk .judul b { font-size: 18px; font-weight: 800; }
  .dash { border-top: 1px dashed #DCCDBB; padding-top: 12px; }
  .acts { display: flex; flex-direction: column; gap: 8px; }
  .incart { font-size: 12px; font-weight: 700; color: var(--hijau); margin-top: 2px; }
  .cline { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .cl-main { min-width: 0; }
  .cl-ctl { display: flex; align-items: center; gap: 10px; flex: none; }
  .chip.off { opacity: .55; text-decoration: line-through; background: #F1E6D8; cursor: not-allowed; }
  .chip.off small { text-decoration: none; display: inline-block; font-weight: 700; color: var(--merah); }
  .qbtn.sm { width: 40px; height: 40px; font-size: 18px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(43,27,16,.55); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 20px 20px calc(16px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
  @media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; } }
  .payb { display: flex; flex-direction: column; gap: 10px; }
  .payb .qris { width: 100%; max-width: 280px; align-self: center; border-radius: 12px; border: 1px solid var(--garis); }
  .sidebox h2 { margin: 0 0 10px; font-size: 17px; font-weight: 800; }
  .sidebox .lines { margin-bottom: 12px; }
  @media (min-width: 700px) {
    body { font-size: 15px; }
    .hero { padding: 44px 40px 36px; border-radius: 0 0 32px 32px; }
    .hero h1 { font-size: 36px; }
    .hero p { font-size: 16px; }
    .hero::after { font-size: 170px; right: 40px; bottom: -34px; }
    .chips { padding: 4px 0 16px; }
    .pad { padding-left: 40px; padding-right: 40px; }
    .wrap.wide .pad { padding-left: 24px; padding-right: 24px; }
    .shop { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; padding: 0 24px 40px; align-items: start; }
    .list { padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; align-content: start; }
    .item { flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; }
    .item:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74,45,23,.14); }
    .item .foto { width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 0; font-size: 64px; }
    .item .info { padding: 12px 14px 4px; }
    .item .nama { font-size: 16px; }
    .item .ctl { width: auto; padding: 8px 14px 14px; justify-content: space-between; align-items: center; }
    .side { display: block; position: sticky; top: 16px; }
    .wrap.wide .bar { display: none; }
    .wrap:not(.wide) { max-width: 680px; }
    .top h1 { font-size: 22px; }
  }
  @media print {
    .noprint { display: none !important; }
    body { background: #fff; }
    .hero, .queue { background: #fff !important; color: #000 !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:20px">Halaman ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var cfg = window.EA_CONFIG || {};
  var root = document.getElementById('app');

  // ---------- pembantu ----------
  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') e.className = v;
        else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'value') e.value = v;
        else e.setAttribute(k, v === true ? '' : v);
      });
    }
    (function add(list) {
      list.forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        if (Array.isArray(c)) return add(c);
        e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
      });
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function rp(n) { return 'Rp ' + String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function getStore(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function setStore(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var ok = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf('XXXX') === -1 &&
           cfg.SUPABASE_ANON_KEY && cfg.SUPABASE_ANON_KEY.indexOf('ISI_') !== 0;
  if (!ok || !window.supabase) {
    root.appendChild(h('div', { class: 'wrap' }, h('p', { class: 'pad err' },
      !ok ? 'Aplikasi belum dikonfigurasi. Isi config.js terlebih dahulu.' : 'Library gagal dimuat. Periksa sambungan internet lalu muat ulang.')));
    return;
  }
  var db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY,
    { auth: { persistSession: false, autoRefreshToken: false } });

  // ---------- data tetap ----------
  var BANK = cfg.BANK_INFO || 'Bank Pembangunan Daerah Sultra 22802010020061 a.n. WA ODE ERNI';
  var WA = String(cfg.WA_KASIR || '082282288380').replace(/\D/g, '').replace(/^0/, '62');
  var TYPES = [['bungkus', 'Bungkus'], ['makan', 'Makan di tempat'], ['antar', 'Antar']];
  var TIMES = ['Sekarang', '15 menit lagi', '30 menit lagi'];
  var FINAL = ['selesai', 'ditolak', 'dibatalkan'];
  var TOKEN_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  var S = {
    view: 'menu', menu: [], toppings: [], sheet: null, loading: true, loadErr: '', cat: null, lines: [],
    type: 'bungkus', payLater: false, time: 'Sekarang', table: '', addr: '',
    name: getStore('ea_name') || '', phone: getStore('ea_phone') || '',
    busy: false, msg: '', token: null, order: null, orderErr: ''
  };
  var pollTimer = null;

  // ---------- keranjang ----------
  function categories() {
    var c = [];
    S.menu.forEach(function (m) { if (c.indexOf(m.category) < 0) c.push(m.category); });
    return c;
  }
  function menuById(id) { return S.menu.filter(function (m) { return m.id === id; })[0]; }
  function lineKey(id, tops) { return id + '|' + tops.join(','); }
  function cartLines() { return S.lines.filter(function (l) { var m = menuById(l.id); return m && m.is_available; }); }
  function cartCount() { return cartLines().reduce(function (a, l) { return a + l.qty; }, 0); }
  function cartSub() { return cartLines().reduce(function (a, l) { return a + l.qty * menuById(l.id).price; }, 0); }
  function itemQty(id) { return S.lines.reduce(function (a, l) { return a + (l.id === id ? l.qty : 0); }, 0); }
  function addLine(id, tops, n) {
    var k = lineKey(id, tops), l = S.lines.filter(function (x) { return x.key === k; })[0];
    if (!l) { l = { key: k, id: id, tops: tops, qty: 0 }; S.lines.push(l); }
    l.qty = Math.max(0, Math.min(50, l.qty + n));
    if (l.qty === 0) S.lines = S.lines.filter(function (x) { return x !== l; });
    render();
  }
  function topText(l) { return l.tops.length ? 'Topping: ' + l.tops.join(', ') : ''; }
  function go(v) { S.view = v; S.msg = ''; render(); window.scrollTo(0, 0); }

  // ---------- muat menu ----------
  async function loadMenu() {
    S.loading = true; S.loadErr = ''; render();
    var r;
    try { r = await db.from('public_menu').select('*'); } catch (e) { r = { error: e }; }
    if (r.error) {
      S.loadErr = 'Menu belum bisa dimuat. Periksa sambungan internet lalu coba lagi.';
    } else {
      S.menu = r.data || [];
      var cats = categories();
      if (!S.cat || cats.indexOf(S.cat) < 0) S.cat = cats[0] || null;

    }
    if (!r.error) {
      var fr;
      try { fr = await db.from('public_menu_foto').select('*'); } catch (e) { fr = { error: e }; }
      if (fr && !fr.error && fr.data) {
        var map = {};
        fr.data.forEach(function (x) { map[x.id] = x; });
        S.menu.forEach(function (m) {
          var x = map[m.id]; if (!x) return;
          if (!m.image_url && x.image_url) m.image_url = x.image_url;
          m.allow_topping = !!x.allow_topping;
        });
      }
      var tr;
      try { tr = await db.from('public_toppings').select('*'); } catch (e) { tr = { error: e }; }
      S.toppings = (tr && !tr.error && tr.data) ? tr.data.map(function (x) { return { name: x.name, ok: x.is_available !== false }; }) : [];
    }
    S.loading = false; render();
  }

  // ---------- kirim pesanan ----------
  function friendly(msg) {
    return /^(Stok|Menu|Nama|Pesanan|Alamat|Nomor|Jumlah|Terlalu|Topping)/.test(msg || '')
      ? msg : 'Pesanan belum terkirim. Periksa sambungan internet lalu coba lagi.';
  }
  async function submit() {
    if (S.busy) return;
    var name = S.name.trim();
    var lines = cartLines(), withTop = lines.some(function (l) { return l.tops.length; });
    var wrap = withTop || S.payLater;
    var items = lines.map(function (l) { return wrap ? { menu_item_id: l.id, qty: l.qty, toppings: l.tops } : { menu_item_id: l.id, qty: l.qty }; });
    if (!items.length) { S.msg = 'Keranjang masih kosong.'; return render(); }
    if (!name) { S.msg = 'Nama wajib diisi.'; return render(); }
    if (S.type === 'makan' && !S.table.trim()) { S.msg = 'Nomor meja wajib diisi.'; return render(); }
    if (S.type === 'antar' && S.addr.trim().length < 5) { S.msg = 'Alamat pengantaran wajib diisi.'; return render(); }
    S.busy = true; S.msg = ''; render();
    var r;
    try {
      var args = {
        p_name: name,
        p_phone: S.phone.trim() || null,
        p_type: S.type,
        p_items: items,
        p_pickup_note: S.type === 'bungkus' ? S.time : null,
        p_table_no: S.type === 'makan' ? S.table.trim() : null,
        p_address: S.type === 'antar' ? S.addr.trim() : null,
        p_pay: 'kasir'
      };
      if (S.payLater) args.p_paylater = true;
      r = await db.rpc(wrap ? 'create_order_topping' : 'create_order', args);
    } catch (e) { r = { error: { message: 'jaringan' } }; }
    S.busy = false;
    if (r.error || !r.data || !r.data.token) {
      S.msg = friendly(r.error && r.error.message);
      render();
      loadMenu();
      return;
    }
    setStore('ea_name', name); setStore('ea_phone', S.phone.trim());
    setStore('ea_last', r.data.token);
    S.token = r.data.token; S.order = null; S.orderErr = ''; S.lines = []; S.payLater = false;
    try { history.replaceState(null, '', '?o=' + S.token); } catch (e) {}
    go('status');
    fetchOrder(); startPoll();
  }

  // ---------- status pesanan ----------
  function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function startPoll() { stopPoll(); pollTimer = setInterval(function () { if (!document.hidden) fetchOrder(); }, 5000); }
  async function fetchOrder() {
    if (!S.token) return;
    if (!TOKEN_RE.test(S.token)) { S.orderErr = 'Link pesanan tidak valid.'; stopPoll(); return render(); }
    var r;
    try { r = await db.rpc('get_order_status', { p_token: S.token }); } catch (e) { r = { error: e }; }
    if (r.error) { S.orderErr = 'Status belum bisa dimuat, mencoba lagi...'; }
    else if (!r.data) { S.orderErr = 'Pesanan tidak ditemukan. Periksa kembali link Anda.'; S.order = null; stopPoll(); }
    else { S.order = r.data; S.orderErr = ''; if (FINAL.indexOf(r.data.status) >= 0) stopPoll(); }
    if (S.view === 'status') render();
  }
  function openLast() {
    S.token = getStore('ea_last'); S.order = null; S.orderErr = '';
    try { history.replaceState(null, '', '?o=' + S.token); } catch (e) {}
    go('status'); fetchOrder(); startPoll();
  }
  function reset() {
    stopPoll(); S.token = null; S.order = null; S.orderErr = ''; S.lines = [];
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    go('menu'); loadMenu();
  }
  function copyLink(ev) {
    var btn = ev.currentTarget;
    var url = location.origin + location.pathname + '?o=' + S.token;
    function done() { var t = btn.textContent; btn.textContent = 'Link tersalin'; setTimeout(function () { btn.textContent = t; }, 1800); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { window.prompt('Salin link struk ini:', url); });
    } else { window.prompt('Salin link struk ini:', url); }
  }

  // ---------- tampilan: menu ----------
  function chip(label, on, fn) { return h('button', { class: 'chip' + (on ? ' on' : ''), onClick: fn }, label); }

  function icon(m) {
    var t = (m.name + ' ' + (m.category || '')).toLowerCase();
    return /bakso|tuna|bakar/.test(t) ? '🍢' : /minum|es |teh|kopi|jus/.test(t) ? '🥤' : '🥟';
  }
  function menuCard(m) {
    var q = itemQty(m.id), ctrl, canTop = m.allow_topping && S.toppings.length > 0;
    if (!m.is_available) ctrl = h('span', { class: 'habis' }, 'Habis');
    else if (canTop) ctrl = h('button', { class: 'btn-add', onClick: function () { S.sheet = { id: m.id, tops: [], qty: 1 }; render(); refreshToppings(); } }, 'Tambah');
    else if (q === 0) ctrl = h('button', { class: 'btn-add', onClick: function () { addLine(m.id, [], 1); } }, 'Tambah');
    else ctrl = h('div', { class: 'qty' },
      h('button', { class: 'qbtn', 'aria-label': 'Kurangi ' + m.name, onClick: function () { addLine(m.id, [], -1); } }, '−'),
      h('span', { class: 'qnum' }, q),
      h('button', { class: 'qbtn plus', 'aria-label': 'Tambah ' + m.name, onClick: function () { addLine(m.id, [], 1); } }, '+'));
    return h('div', { class: 'card item' + (m.is_available ? '' : ' off') },
      h('div', { class: 'foto', 'aria-hidden': 'true' },
        m.image_url ? h('img', { src: m.image_url, alt: '', loading: 'lazy' }) : icon(m),
        m.is_available ? null : h('span', { class: 'tag' }, 'Habis')),
      h('div', { class: 'info' },
        h('div', { class: 'nama' }, m.name),
        h('div', { class: 'ket' }, m.description || ''),
        canTop ? h('div', { class: 'ket' }, 'Bisa pakai topping') : null,
        h('div', { class: 'harga' }, rp(m.price)),
        (canTop && q > 0) ? h('div', { class: 'incart' }, q + ' di keranjang') : null),
      h('div', { class: 'ctl' }, ctrl));
  }

  // saat lembar topping dibuka, ambil status ready/habis terbaru
  async function refreshToppings() {
    var r;
    try { r = await db.from('public_toppings').select('*'); } catch (e) { return; }
    if (!r || r.error || !r.data) return;
    S.toppings = r.data.map(function (x) { return { name: x.name, ok: x.is_available !== false }; });
    if (S.sheet) S.sheet.tops = S.sheet.tops.filter(function (n) { return S.toppings.some(function (t) { return t.name === n && t.ok; }); });
    render();
  }
  function sheetView() {
    var sh = S.sheet, m = menuById(sh.id);
    if (!m) return null;
    function toggle(t) {
      var i = sh.tops.indexOf(t);
      if (i >= 0) sh.tops.splice(i, 1); else sh.tops.push(t);
      sh.tops = S.toppings.map(function (x) { return x.name; }).filter(function (x) { return sh.tops.indexOf(x) >= 0; });
      render();
    }
    return h('div', { class: 'sheet-bg', onClick: function (e) { if (e.target === e.currentTarget) { S.sheet = null; render(); } } },
      h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Pilih topping ' + m.name },
        h('h2', null, m.name),
        h('p', { class: 'note', style: 'margin:0 0 10px' }, 'Topping gratis. Boleh pilih lebih dari satu, atau tidak pakai topping.'),
        h('div', { class: 'seg' }, S.toppings.map(function (t) {
          var on = sh.tops.indexOf(t.name) >= 0;
          if (!t.ok) return h('button', { class: 'chip off', disabled: true, 'aria-label': t.name + ', habis' }, t.name, h('small', null, ' · habis'));
          return h('button', { class: 'chip' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false', onClick: function () { toggle(t.name); } }, t.name);
        })),
        h('div', { class: 'row', style: 'align-items:center;margin:16px 0 12px' },
          h('span', { class: 'lbl', style: 'margin:0' }, 'Jumlah cup'),
          h('div', { class: 'qty' },
            h('button', { class: 'qbtn', 'aria-label': 'Kurangi jumlah', onClick: function () { sh.qty = Math.max(1, sh.qty - 1); render(); } }, '−'),
            h('span', { class: 'qnum' }, sh.qty),
            h('button', { class: 'qbtn plus', 'aria-label': 'Tambah jumlah', onClick: function () { sh.qty = Math.min(50, sh.qty + 1); render(); } }, '+'))),
        h('button', { class: 'btn', onClick: function () { var t = sh.tops.slice(); var n = sh.qty; S.sheet = null; addLine(m.id, t, n); } },
          h('span', null, 'Tambah ke keranjang'), h('span', null, rp(sh.qty * m.price))),
        h('button', { class: 'link', style: 'width:100%;margin-top:6px', onClick: function () { S.sheet = null; render(); } }, 'Batal')));
  }

  function sideBox(n) {
    var lines = cartLines().map(function (l) {
      var m = menuById(l.id);
      return h('div', null, h('div', { class: 'row' }, h('span', null, l.qty + ' x ' + m.name), h('span', { class: 'nama' }, rp(l.qty * m.price))),
        l.tops.length ? h('div', { class: 'ket' }, topText(l)) : null);
    });
    return h('aside', { class: 'side' }, h('div', { class: 'card sidebox' },
      h('h2', null, 'Pesanan Anda'),
      n > 0 ? h('div', { class: 'lines' }, lines) : h('p', { class: 'redup' }, 'Belum ada menu dipilih. Tekan Tambah pada menu yang Anda mau.'),
      n > 0 ? h('div', { class: 'row total', style: 'margin-bottom:12px' }, h('span', null, 'Subtotal'), h('span', null, rp(cartSub()))) : null,
      n > 0 ? h('button', { class: 'btn', onClick: function () { go('cart'); } },
        h('span', null, 'Lihat keranjang · ' + n + ' item'), h('span', null, rp(cartSub()))) : null));
  }
  function viewMenu() {
    var cats = categories();
    var items = S.menu.filter(function (m) { return m.category === S.cat; });
    var n = cartCount();
    var body;
    if (S.loading) body = h('p', { class: 'pad redup' }, 'Memuat menu...');
    else if (S.loadErr) body = h('div', { class: 'pad' }, h('p', { class: 'err' }, S.loadErr), h('button', { class: 'btn-ghost', onClick: loadMenu }, 'Coba lagi'));
    else if (!S.menu.length) body = h('p', { class: 'pad redup' }, 'Menu belum tersedia.');
    else body = [
      h('div', { class: 'shop' },
        h('div', null,
          h('div', { class: 'chips' }, cats.map(function (c) { return chip(c, S.cat === c, function () { S.cat = c; render(); }); })),
          h('main', { class: 'list' }, items.map(menuCard))),
        sideBox(n))
    ];
    return h('div', { class: 'wrap wide' },
      h('header', { class: 'hero' },
        h('div', { class: 'brand' }, 'EA DIMSUM'),
        h('h1', null, 'Mau pesan apa hari ini?'),
        h('p', null, 'Pesan dari HP, ambil tanpa antre.')),
      (getStore('ea_last') && !S.token) ? h('div', { class: 'pad' }, h('button', { class: 'btn-ghost', onClick: openLast }, 'Lihat pesanan terakhir Anda')) : null,
      body,
      h('div', { class: 'bar' }, n > 0
        ? h('button', { class: 'btn', onClick: function () { go('cart'); } },
            h('span', null, 'Lihat keranjang · ' + n + ' item'), h('span', null, rp(cartSub())))
        : h('div', { class: 'redup center' }, 'Pilih menu untuk memulai pesanan')),
      S.sheet ? sheetView() : null);
  }

  // ---------- tampilan: keranjang ----------
  function viewCart() {
    var lines = cartLines().map(function (l) {
      var m = menuById(l.id);
      return h('div', { class: 'cline' },
        h('div', { class: 'cl-main' }, h('div', null, l.qty + ' x ' + m.name), l.tops.length ? h('div', { class: 'ket' }, topText(l)) : null),
        h('div', { class: 'cl-ctl' },
          h('span', { class: 'nama' }, rp(l.qty * m.price)),
          h('div', { class: 'qty' },
            h('button', { class: 'qbtn sm', 'aria-label': 'Kurangi ' + m.name + (l.tops.length ? ' ' + topText(l) : ''), onClick: function () { addLine(l.id, l.tops, -1); } }, '−'),
            h('button', { class: 'qbtn sm plus', 'aria-label': 'Tambah ' + m.name + (l.tops.length ? ' ' + topText(l) : ''), onClick: function () { addLine(l.id, l.tops, 1); } }, '+'))));
    });
    var extra;
    if (S.type === 'bungkus') {
      extra = h('div', null, h('span', { class: 'lbl' }, 'Jam ambil'),
        h('div', { class: 'seg' }, TIMES.map(function (t) { return chip(t, S.time === t, function () { S.time = t; render(); }); })));
    } else if (S.type === 'makan') {
      extra = h('div', null, h('label', { class: 'lbl', for: 'f-meja' }, 'Nomor meja'),
        h('input', { type: 'text', id: 'f-meja', value: S.table, maxlength: '10', placeholder: 'Contoh: 3', onInput: function (e) { S.table = e.target.value; } }));
    } else {
      extra = h('div', null, h('label', { class: 'lbl', for: 'f-alamat' }, 'Alamat pengantaran'),
        h('input', { type: 'text', id: 'f-alamat', value: S.addr, maxlength: '300', placeholder: 'Jalan, nomor, patokan', autocomplete: 'street-address', onInput: function (e) { S.addr = e.target.value; } }),
        h('p', { class: 'note' }, 'Pesanan antar diperiksa admin dulu. Ongkir ditentukan admin setelah pesanan disetujui' + (S.payLater ? '.' : ', lalu Anda bisa membayar.')));
    }
    var payNote = S.payLater
      ? (S.type === 'antar' ? 'Pesanan antar diperiksa admin dulu. Setelah disetujui, pesanan langsung diproses dan Anda membayar tunai saat pesanan sampai (COD).' : S.type === 'makan' ? 'Pesanan langsung diproses. Bayar tunai di kasir.' : 'Pesanan langsung diproses. Bayar tunai saat pesanan diambil.')
      : S.type === 'antar'
      ? 'Pembayaran dilakukan setelah pesanan disetujui admin.'
      : 'Bayar lewat QRIS atau transfer: setelah memesan, kirim konfirmasi pembayaran lewat WhatsApp. Bisa juga bayar tunai di kasir. Pesanan diproses setelah pembayaran dikonfirmasi.';
    return h('div', { class: 'wrap' },
      h('div', { class: 'top' }, h('button', { class: 'link', onClick: function () { go('menu'); } }, 'Kembali'), h('h1', null, 'Pesanan Anda')),
      h('div', { class: 'body' },
        h('div', { class: 'card lines' }, lines),
        h('div', null, h('span', { class: 'lbl' }, 'Jenis pesanan'),
          h('div', { class: 'seg' }, TYPES.map(function (t) { return chip(t[1], S.type === t[0], function () { S.type = t[0]; S.msg = ''; render(); }); }))),
        extra,
        h('div', null, h('span', { class: 'lbl' }, 'Pembayaran'),
          h('div', { class: 'seg' },
            chip('Transfer / QRIS', !S.payLater, function () { S.payLater = false; render(); }),
            chip(S.type === 'antar' ? 'Tunai saat diantar (COD)' : S.type === 'makan' ? 'Tunai di kasir' : 'Tunai saat ambil', S.payLater, function () { S.payLater = true; render(); }))),
        h('div', null, h('label', { class: 'lbl', for: 'f-nama' }, 'Atas nama'),
          h('input', { type: 'text', id: 'f-nama', value: S.name, maxlength: '60', placeholder: 'Nama Anda', autocomplete: 'name', onInput: function (e) { S.name = e.target.value; } })),
        h('div', null, h('label', { class: 'lbl', for: 'f-hp' }, 'Nomor WhatsApp (opsional)'),
          h('input', { type: 'tel', id: 'f-hp', value: S.phone, maxlength: '20', placeholder: '08xxxxxxxxxx', autocomplete: 'tel', onInput: function (e) { S.phone = e.target.value; } })),
        h('div', { class: 'box note' }, payNote)),
      h('div', { class: 'bar' },
        S.msg ? h('div', { class: 'err', role: 'alert' }, S.msg) : null,
        h('div', { class: 'row total' }, h('span', null, 'Subtotal'), h('span', null, rp(cartSub()))),
        h('button', { class: 'btn solo', disabled: S.busy, onClick: submit }, S.busy ? 'Mengirim...' : (S.type === 'antar' ? 'Ajukan pesanan antar' : 'Kirim pesanan'))));
  }

  // ---------- tampilan: status + struk ----------
  function typeLabel(o) { return o.order_type === 'bungkus' ? 'Bungkus' : o.order_type === 'makan' ? 'Makan di tempat' : 'Antar'; }
  function detailText(o) {
    if (o.order_type === 'bungkus') return 'Bungkus, ambil ' + String(o.pickup_note || '').toLowerCase();
    if (o.order_type === 'makan') return 'Makan di tempat, meja ' + (o.table_no || '-');
    return 'Antar ke: ' + (o.delivery_address || '-');
  }
  function stepsFor(o) {
    if (o.order_type === 'antar' && o.pay_later) return [['menunggu_persetujuan', 'Menunggu persetujuan admin'], ['baru', 'Pesanan diterima'], ['diproses', 'Sedang diproses'], ['siap', 'Siap diantar'], ['selesai', 'Selesai']];
    if (o.order_type === 'antar') return [['menunggu_persetujuan', 'Menunggu persetujuan admin'], ['menunggu_pembayaran', 'Menunggu pembayaran'], ['baru', 'Pesanan diterima'], ['diproses', 'Sedang diproses'], ['siap', 'Siap diantar'], ['selesai', 'Selesai']];
    return [['baru', 'Pesanan diterima'], ['diproses', 'Sedang diproses'], ['siap', o.order_type === 'makan' ? 'Siap disajikan' : 'Siap diambil'], ['selesai', 'Selesai']];
  }
  function statusMessage(o) {
    var m = {
      menunggu_persetujuan: ['info', 'Pesanan antar Anda sedang diperiksa admin. Ongkir ditentukan setelah pesanan disetujui.'],
      menunggu_pembayaran: ['info', 'Pesanan disetujui. Total sudah termasuk ongkir ' + rp(o.delivery_fee) + '. Silakan bayar ke kasir; pesanan masuk dapur setelah pembayaran dikonfirmasi.'],
      baru: ['info', o.payment_status === 'lunas' ? 'Pesanan diterima dan masuk antrean dapur.'
        : o.pay_later ? 'Pesanan diterima dan masuk antrean dapur. Bayar tunai saat ' + (o.order_type === 'antar' ? 'pesanan diantar.' : o.order_type === 'makan' ? 'selesai makan.' : 'pesanan diambil.')
        : 'Pesanan diterima. Pesanan mulai diproses setelah pembayaran dikonfirmasi kasir.'],
      diproses: ['info', 'Pesanan sedang disiapkan.'],
      siap: ['good', o.order_type === 'bungkus' ? 'Pesanan siap diambil. Tunjukkan nomor antrean ke kasir.' : o.order_type === 'makan' ? 'Pesanan siap disajikan.' : 'Pesanan siap diantar.'],
      selesai: ['good', 'Pesanan selesai. Terima kasih sudah memesan di EA Dimsum!'],
      ditolak: ['bad', 'Pesanan ditolak' + (o.reject_reason ? ': ' + o.reject_reason : '.')],
      dibatalkan: ['bad', 'Pesanan dibatalkan.']
    };
    return m[o.status] || ['info', ''];
  }
  function payText(o) {
    if (o.payment_status === 'lunas') return 'Lunas';
    if (o.order_type === 'antar' && o.status === 'menunggu_persetujuan') return 'Belum bisa dibayar';
    if (o.pay_later) return o.order_type === 'antar' ? 'Belum lunas (bayar tunai/COD)' : 'Belum lunas (bayar tunai)';
    return 'Belum lunas';
  }

  function viewStatus() {
    var o = S.order;
    var kids = [];
    if (!o) {
      kids.push(S.orderErr ? h('p', { class: 'err', role: 'alert' }, S.orderErr) : h('p', { class: 'redup' }, 'Memuat pesanan...'));
    } else {
      var msg = statusMessage(o);
      var steps = stepsFor(o), idx = -1;
      steps.forEach(function (s, i) { if (s[0] === o.status) idx = i; });
      var stopped = o.status === 'ditolak' || o.status === 'dibatalkan';
      kids.push(h('div', { class: 'queue' },
        h('div', null, 'Nomor antrean'), h('div', { class: 'no' }, o.queue_no),
        h('div', { class: 'sub' }, o.customer_name + ' · ' + typeLabel(o))));
      kids.push(h('div', { class: 'banner ' + msg[0], role: 'status' }, msg[1]));
      if (!stopped) {
        kids.push(h('div', { class: 'card steps' }, steps.map(function (s, i) {
          var done = i < idx || o.status === 'selesai';
          var now = i === idx && !done;
          return h('div', { class: 'step' + (done ? ' done' : '') + (now ? ' now' : '') },
            h('div', { class: 'dot' }), h('div', { class: 't' }, s[1]), h('div', { class: 's' }, done ? 'Selesai' : now ? 'Sekarang' : ''));
        })));
      }
      if (S.orderErr) kids.push(h('p', { class: 'note' }, S.orderErr));
      if (!stopped && o.payment_status !== 'lunas' && !(o.order_type === 'antar' && o.status === 'menunggu_persetujuan')) {
        if (o.pay_later) {
          kids.push(h('div', { class: 'card payb noprint' },
            h('b', null, 'Pembayaran tunai'),
            h('p', { class: 'note', style: 'margin:0' }, 'Siapkan ' + rp(o.total) + (o.order_type === 'antar' ? ' untuk dibayar tunai kepada kurir saat pesanan sampai (COD).' : o.order_type === 'makan' ? ' untuk dibayar tunai di kasir.' : ' untuk dibayar tunai ke kasir saat pesanan diambil.')),
            h('p', { class: 'note', style: 'margin:0' }, 'Pesanan Anda tetap diproses tanpa menunggu pembayaran.')));
        } else {
        var waMsg = 'Halo EA Dimsum, saya konfirmasi pembayaran pesanan ' + o.queue_no + ' atas nama ' + o.customer_name + ', total ' + rp(o.total) + '. Link pesanan: ' + location.origin + location.pathname + '?o=' + S.token;
        kids.push(h('div', { class: 'card payb noprint' },
          h('b', null, 'Cara membayar'),
          cfg.QRIS_IMG ? h('img', { class: 'qris', src: cfg.QRIS_IMG, alt: 'QRIS EA Dimsum' }) : null,
          BANK ? h('div', { class: 'box' }, h('div', { class: 'ket' }, 'Transfer ke rekening'), h('div', { class: 'nama' }, BANK)) : null,
          (BANK && /\d{8,}/.test(BANK)) ? h('button', { class: 'btn-ghost', onClick: function (ev) {
            var btn = ev.currentTarget, no = BANK.match(/\d{8,}/)[0];
            function done() { var t = btn.textContent; btn.textContent = 'Nomor tersalin'; setTimeout(function () { btn.textContent = t; }, 1800); }
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(no).then(done, function () { window.prompt('Salin nomor rekening:', no); });
            else window.prompt('Salin nomor rekening:', no);
          } }, 'Salin nomor rekening') : null,
          h('p', { class: 'note', style: 'margin:0' }, (cfg.QRIS_IMG || BANK)
            ? 'Bayar sesuai total ' + rp(o.total) + ', lalu kirim bukti pembayaran lewat WhatsApp. Pesanan diproses setelah kasir mengonfirmasi.'
            : 'Bayar tunai di kasir, atau chat kasir lewat WhatsApp untuk meminta info QRIS/transfer. Pesanan diproses setelah pembayaran dikonfirmasi kasir.'),
          h('a', { class: 'btn-ghost', target: '_blank', rel: 'noopener', href: 'https://wa.me/' + WA + '?text=' + encodeURIComponent(waMsg) }, 'Konfirmasi pembayaran via WhatsApp')));
        }
      }
      kids.push(h('div', { class: 'card struk' },
        h('div', { class: 'judul' }, h('b', null, 'EA Dimsum'), h('div', { class: 'note' },
          new Date(o.created_at).toLocaleString('id-ID', { timeZone: 'Asia/Makassar', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' · No. ' + o.queue_no)),
        h('div', { class: 'dash' }, h('div', { class: 'nama' }, o.customer_name), h('div', { class: 'note' }, detailText(o))),
        h('div', { class: 'dash lines' }, (o.items || []).map(function (it) {
          return h('div', null, h('div', { class: 'row' }, h('span', null, it.qty + ' x ' + it.name), h('span', null, rp(it.line_total))),
            it.note ? h('div', { class: 'ket' }, it.note) : null);
        })),
        h('div', { class: 'dash lines' },
          h('div', { class: 'row' }, h('span', { class: 'redup' }, 'Subtotal'), h('span', null, rp(o.subtotal))),
          Number(o.discount) > 0 ? h('div', { class: 'row' }, h('span', { class: 'redup' }, 'Diskon' + (o.discount_note ? ' (' + o.discount_note + ')' : '')), h('span', null, '- ' + rp(o.discount))) : null,
          o.order_type === 'antar' ? h('div', { class: 'row' }, h('span', { class: 'redup' }, 'Ongkir'), h('span', null, rp(o.delivery_fee))) : null,
          h('div', { class: 'row total' }, h('span', null, 'Total'), h('span', null, rp(o.total)))),
        h('div', { class: 'dash row' }, h('span', { class: 'redup' }, 'Status bayar'), h('b', null, payText(o))),
        h('div', { class: 'note center' }, 'Terima kasih sudah memesan di EA Dimsum')));
      var acts = [
        h('button', { class: 'btn-ghost', onClick: copyLink }, 'Salin link struk'),
        h('button', { class: 'btn-ghost', onClick: function () { window.print(); } }, 'Cetak / simpan PDF')
      ];
      acts.push(h('a', { class: 'btn-ghost', target: '_blank', rel: 'noopener',
        href: 'https://wa.me/' + WA + '?text=' + encodeURIComponent('Halo EA Dimsum, pesanan ' + o.queue_no + ' atas nama ' + o.customer_name) }, 'Hubungi kasir via WhatsApp'));
      kids.push(h('div', { class: 'acts noprint' }, acts));
    }
    return h('div', { class: 'wrap' },
      h('div', { class: 'top noprint' }, h('h1', null, 'Status pesanan')),
      h('div', { class: 'body' }, kids),
      h('div', { class: 'bar noprint' }, h('button', { class: 'btn solo', onClick: reset }, 'Pesan lagi')));
  }

  // ---------- render ----------
  function render() {
    var y = window.scrollY;
    while (root.firstChild) root.removeChild(root.firstChild);
    root.appendChild(S.view === 'menu' ? viewMenu() : S.view === 'cart' ? viewCart() : viewStatus());
    window.scrollTo(0, y);
  }

  // ---------- mulai ----------
  var param = null;
  try { param = new URLSearchParams(location.search).get('o'); } catch (e) {}
  if (param) { S.token = param; S.view = 'status'; render(); fetchOrder(); startPoll(); }
  else { render(); }
  loadMenu();
})();
</script>
</body>
</html>
