<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kasir EA Dimsum</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --gelap: #4A2D17; --kayu: #7A4A25; --terang: #9A6431;
    --bg: #FBF9F6; --teks: #2B1B10; --garis: #E8DDD0; --redup: #6F5C4C;
    --krem: #F1E6D8; --hijau: #17684D; --merah: #A32A1F;
    --grad: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0, rgba(255,255,255,.05) 2px, transparent 2px, transparent 9px), linear-gradient(135deg, #4A2D17, #7A4A25 55%, #9A6431);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--teks); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.4; }
  button, input, select { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .page { max-width: 1280px; margin: 0 auto; padding: 0 16px 40px; }
  .hdr { background: var(--grad); color: #fff; position: sticky; top: 0; z-index: 5; box-shadow: 0 4px 14px rgba(74,45,23,.2); }
  .hdr .in { max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hdr b { font-size: 18px; font-weight: 800; }
  .hdr .who { display: flex; align-items: center; gap: 10px; }
  .hdr .out { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.7); background: transparent; color: #fff; font-weight: 700; }
  .tabs { display: flex; gap: 8px; padding: 14px 0 8px; overflow-x: auto; }
  .tab { flex: none; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #DCCDBB; background: #fff; color: var(--teks); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .tab.on { background: var(--kayu); border-color: var(--kayu); color: #fff; }
  .cnt { background: #FFE3A3; color: #5C3A00; border-radius: 10px; padding: 0 8px; font-size: 12px; font-weight: 800; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 0 12px; }
  .chip { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #DCCDBB; background: #fff; color: var(--teks); font-weight: 600; }
  .chip.on { background: var(--teks); border-color: var(--teks); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .card { background: #fff; border: 1px solid var(--garis); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .no { font-size: 18px; font-weight: 800; }
  .redup { color: var(--redup); }
  .small { font-size: 12px; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; white-space: nowrap; }
  .b-wait { background: #FFE3A3; color: #5C3A00; }
  .b-new { background: #DCE9FA; color: #103E78; }
  .b-proc { background: #EBD9C4; color: #4A2D17; }
  .b-ok { background: #D5EDE3; color: #0E4F39; }
  .b-end { background: #E6E1DA; color: #3F3832; }
  .b-bad { background: #F8DAD6; color: #7E1A12; }
  .box { background: var(--krem); border-radius: 12px; padding: 10px 12px; }
  .lines { display: flex; flex-direction: column; gap: 4px; }
  .dash { border-top: 1px dashed #DCCDBB; padding-top: 10px; }
  .total { font-weight: 800; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .b-main { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--grad); color: #fff; font-weight: 700; }
  .b-out { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--kayu); background: #fff; color: var(--kayu); font-weight: 700; }
  .b-del { min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--merah); font-weight: 700; }
  input[type=text], input[type=number], input[type=email], input[type=password], select { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #DCCDBB; background: #fff; color: var(--teks); font-size: 15px; }
  label.lbl, .lbl { display: block; font-weight: 700; margin-bottom: 6px; }
  .alert { border-radius: 12px; padding: 10px 14px; font-weight: 600; margin: 8px 0; }
  .alert.bad { background: #F8DAD6; color: #7E1A12; }
  .alert.good { background: #D5EDE3; color: #0E4F39; }
  .empty { text-align: center; padding: 40px 0; color: var(--redup); }
  .login { max-width: 380px; margin: 48px auto; padding: 0 16px; }
  .login h1 { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
  .login .card { gap: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .stat .v { font-size: 22px; font-weight: 800; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--garis); }
  th { font-size: 12px; color: var(--redup); font-weight: 700; }
  td.n, th.n { text-align: right; }
  .tw { overflow-x: auto; }
  .bar { height: 10px; border-radius: 5px; background: var(--kayu); min-width: 2px; }
  .hrow { display: grid; grid-template-columns: 54px 1fr 110px; gap: 10px; align-items: center; padding: 4px 0; }
  .sgrid { display: grid; gap: 12px; }
  .sctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sctl input { width: 110px; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  h2 { font-size: 16px; margin: 18px 0 8px; font-weight: 800; }
  .pos { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  .pcart { gap: 12px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .pbtn { position: relative; min-height: 96px; padding: 12px; border-radius: 16px; border: 1.5px solid #DCCDBB; background: #fff; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 2px; text-align: left; color: var(--teks); overflow: hidden; }
  .pbtn b { font-size: 15px; } .pbtn span { color: var(--kayu); font-weight: 800; }
  .pbtn img { width: 100%; height: 70px; object-fit: cover; border-radius: 10px; margin-bottom: 6px; }
  .pbtn i { position: absolute; top: 8px; right: 8px; background: var(--kayu); color: #fff; font-style: normal; font-weight: 800; min-width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .pbtn.off { opacity: .5; }
  .pbtn:active { transform: scale(.98); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(43,27,16,.55); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 20px; padding: 20px; max-height: 92vh; overflow-y: auto; }
  .chip.off { opacity: .55; text-decoration: line-through; cursor: not-allowed; }
  @media (min-width: 900px) { .pos { grid-template-columns: minmax(0, 1fr) 400px; } .pcart { position: sticky; top: 84px; } }
  .wp { position: fixed; inset: -24px; z-index: -1; pointer-events: none; background-size: cover; background-position: center; transform: scale(1.04); }
  @media print { .wp { display: none !important; } }
  .tgls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tgl { min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px solid; display: inline-flex; align-items: center; gap: 10px; font-weight: 600; background: #fff; }
  .tgl b { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .tgl.ready { border-color: #17684D; color: var(--teks); }
  .tgl.ready b { background: #D5EDE3; color: #0E4F39; }
  .tgl.habis { border-color: #A32A1F; background: #FBEAE7; color: #7E1A12; }
  .tgl.habis span { text-decoration: line-through; }
  .tgl.habis b { background: #A32A1F; color: #fff; }
  .mfoto { width: 84px; height: 84px; flex: none; border-radius: 12px; background: linear-gradient(135deg, #F6EBDC, #E8D3B8); display: flex; align-items: center; justify-content: center; font-size: 34px; overflow: hidden; }
  .mfoto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mhead { display: flex; gap: 12px; align-items: center; }
  .mhead .grow { flex: 1; min-width: 0; }
  .file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .sgrid { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); align-items: start; }
  .card { box-shadow: 0 1px 2px rgba(74,45,23,.05); }
  @media (min-width: 900px) {
    body { font-size: 15px; }
    .page { padding: 0 28px 48px; }
    .hdr .in { padding: 16px 28px; }
    .hdr b { font-size: 21px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .card { padding: 18px; }
    .no { font-size: 20px; }
    .stats { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .stat .v { font-size: 26px; }
  }
  @media (min-width: 1400px) { body { font-size: 16px; } }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:20px">Halaman ini membutuhkan JavaScript.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var cfg = window.EA_CONFIG || {};
  var root = document.getElementById('app');
  var WP_BLUR = 7, WP_OP = 0.22;


  // ---------- wallpaper (latar buram di belakang isi) ----------
  function cssUrl(u) { return encodeURI(String(u)).replace(/['()"\\]/g, function (c) { return '%' + c.charCodeAt(0).toString(16); }); }
  function wpNum(v, d) { var n = Number(v); return (v === undefined || v === null || v === '' || isNaN(n)) ? d : n; }
  function applyWallpaper() {
    var old = document.getElementById('wp'); if (old && old.parentNode) old.parentNode.removeChild(old);
    var blur = wpNum(cfg.WALLPAPER_BLUR, WP_BLUR), op = wpNum(cfg.WALLPAPER_OPACITY_KASIR, WP_OP), el = null;
    if (cfg.WALLPAPER) {
      el = h('div', { id: 'wp', class: 'wp', 'aria-hidden': 'true', style: "background-image:url('" + cssUrl(cfg.WALLPAPER) + "');filter:blur(" + blur + 'px);opacity:' + op });
    }
    if (el) document.body.insertBefore(el, document.body.firstChild);
  }

  // ---------- pembantu ----------
  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') e.className = v;
        else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'value') e.value = v;
        else e.setAttribute(k, v === true ? '' : v);
      });
    }
    (function add(list) {
      list.forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        if (Array.isArray(c)) return add(c);
        e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
      });
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function rp(n) { return 'Rp ' + String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function todayStr() { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Makassar' }); }
  function jam(iso) { return new Date(iso).toLocaleTimeString('id-ID', { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit' }); }
  function tgl(s) { return new Date(s + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }); }
  function bulan(s) { return new Date(s + 'T00:00:00').toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }); }
  function cleanErr(e) {
    var m = (e && e.message) || '';
    if (/jwt|expired|not authenticated/i.test(m)) return 'Sesi habis. Silakan keluar lalu masuk lagi.';
    return m || 'Terjadi kesalahan. Coba lagi.';
  }

  var okCfg = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf('XXXX') === -1 &&
              cfg.SUPABASE_ANON_KEY && cfg.SUPABASE_ANON_KEY.indexOf('ISI_') !== 0;
  if (!okCfg || !window.supabase) {
    root.appendChild(h('p', { class: 'alert bad' }, !okCfg ? 'Aplikasi belum dikonfigurasi. Isi config.js terlebih dahulu.' : 'Library gagal dimuat. Periksa sambungan internet lalu muat ulang.'));
    return;
  }
  var db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  // ---------- data tetap ----------
  var ACTIVE = ['menunggu_persetujuan', 'menunggu_pembayaran', 'baru', 'diproses', 'siap'];
  var LABEL = { menunggu_persetujuan: 'Menunggu persetujuan', menunggu_pembayaran: 'Menunggu pembayaran', baru: 'Baru', diproses: 'Diproses', siap: 'Siap', selesai: 'Selesai', ditolak: 'Ditolak', dibatalkan: 'Dibatalkan' };
  var BADGE = { menunggu_persetujuan: 'b-wait', menunggu_pembayaran: 'b-wait', baru: 'b-new', diproses: 'b-proc', siap: 'b-ok', selesai: 'b-end', ditolak: 'b-bad', dibatalkan: 'b-bad' };
  var TYPE = { bungkus: 'Bungkus', makan: 'Makan di tempat', antar: 'Antar' };
  var NEXT = { baru: ['diproses', 'Mulai proses'], diproses: ['siap', 'Tandai siap'], siap: ['selesai', 'Selesaikan pesanan'] };

  var K = {
    ready: false, profile: null, tab: 'pesanan', filter: 'aktif',
    orders: [], stock: [], menu: [], cats: [], tops: [], topsErr: false, newTop: '', rep: null,
    fee: {}, disc: {}, stockIn: {}, menuEdit: {}, newMenu: { cat: '', newCat: '', name: '', price: '', desc: '' },
    pos: { loaded: false, menu: [], tops: [], lines: [], sheet: null, cat: null, type: 'bungkus', pay: 'Tunai', name: '', table: '', done: true, disc: '', note: '', last: null },
    staff: [], staffErr: false, uid: null, newStaff: { email: '', name: '', role: 'kasir' },
    email: '', pass: '', loginErr: '', busy: false, err: '', info: '', dirty: false
  };
  var chan = null, pollT = null, reloadT = null, ac = null;

  // ---------- bunyi pesanan baru ----------
  function unlockAudio() {
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {}
  }
  function beep() {
    try {
      if (!ac) return;
      [0, 0.3].forEach(function (d) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.15;
        o.connect(g); g.connect(ac.destination);
        o.start(ac.currentTime + d); o.stop(ac.currentTime + d + 0.2);
      });
    } catch (e) {}
  }

  // ---------- render ----------
  function typing() {
    var a = document.activeElement;
    return !!(a && root.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }
  function render() {
    var y = window.scrollY;
    while (root.firstChild) root.removeChild(root.firstChild);
    root.appendChild(!K.ready ? h('p', { class: 'empty' }, 'Memuat...') : !K.profile ? viewLogin() : viewApp());
    window.scrollTo(0, y);
    var perlu = K.orders.filter(function (o) { return o.status === 'menunggu_persetujuan' || o.status === 'baru'; }).length;
    document.title = (K.profile && perlu ? '(' + perlu + ') ' : '') + 'Kasir EA Dimsum';
  }
  function safeRender() { if (typing()) K.dirty = true; else render(); }
  root.addEventListener('focusout', function () {
    setTimeout(function () { if (K.dirty && !typing()) { K.dirty = false; render(); } }, 60);
  });

  // ---------- login ----------
  function viewLogin() {
    return h('div', { class: 'login' },
      h('h1', null, 'Kasir EA Dimsum'),
      h('p', { class: 'redup' }, 'Masuk dengan akun staf.'),
      h('form', { class: 'card', onSubmit: function (e) { e.preventDefault(); login(); } },
        K.loginErr ? h('div', { class: 'alert bad', role: 'alert' }, K.loginErr) : null,
        h('div', null, h('label', { class: 'lbl', for: 'em' }, 'Email'),
          h('input', { type: 'email', id: 'em', value: K.email, autocomplete: 'username', onInput: function (e) { K.email = e.target.value; } })),
        h('div', null, h('label', { class: 'lbl', for: 'pw' }, 'Password'),
          h('input', { type: 'password', id: 'pw', value: K.pass, autocomplete: 'current-password', onInput: function (e) { K.pass = e.target.value; } })),
        h('button', { class: 'b-main', type: 'submit', disabled: K.busy }, K.busy ? 'Masuk...' : 'Masuk')));
  }
  async function login() {
    if (K.busy) return;
    K.loginErr = ''; K.busy = true; render();
    unlockAudio();
    var r;
    try { r = await db.auth.signInWithPassword({ email: K.email.trim(), password: K.pass }); } catch (e) { r = { error: e }; }
    if (r.error || !r.data || !r.data.user) {
      K.busy = false; K.loginErr = 'Email atau password salah.'; return render();
    }
    K.pass = '';
    await afterLogin(r.data.user);
    K.busy = false; render();
  }
  async function afterLogin(user) {
    var p;
    try { p = await db.from('staff_profiles').select('full_name,role,is_active').eq('id', user.id).maybeSingle(); } catch (e) { p = { error: e }; }
    if (p.error || !p.data || p.data.is_active === false) {
      K.loginErr = 'Akun ini belum terdaftar sebagai staf EA Dimsum.';
      K.profile = null; K.ready = true;
      try { await db.auth.signOut(); } catch (e) {}
      return render();
    }
    K.profile = p.data; K.uid = user.id; K.ready = true; K.loginErr = '';
    await loadOrders(true);
    render();
    startLive();
  }
  async function logout() {
    teardown();
    try { await db.auth.signOut(); } catch (e) {}
    K.profile = null; K.orders = []; render();
  }

  // ---------- realtime ----------
  function reloadSoon() {
    clearTimeout(reloadT);
    reloadT = setTimeout(function () {
      loadOrders(true);
      if (K.tab === 'stok') loadStock();
      if (K.tab === 'laporan') loadReport();
    }, 300);
  }
  function startLive() {
    teardown();
    chan = db.channel('orders-live').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, function (p) {
      if (p && p.eventType === 'INSERT') beep();
      reloadSoon();
    }).subscribe();
    pollT = setInterval(function () { if (!document.hidden) loadOrders(true); }, 20000);
  }
  function teardown() {
    if (chan) { try { db.removeChannel(chan); } catch (e) {} chan = null; }
    if (pollT) { clearInterval(pollT); pollT = null; }
  }

  // ---------- muat data ----------
  async function loadOrders(quiet) {
    var r;
    try {
      r = await db.from('orders')
        .select('id,queue_no,customer_name,customer_phone,order_type,status,pickup_note,table_no,delivery_address,delivery_fee,reject_reason,subtotal,discount,discount_note,total,payment_status,payment_method,pay_later,created_at,order_items(item_name,qty,line_total,note)')
        .or('order_day.eq.' + todayStr() + ',status.in.(' + ACTIVE.join(',') + ')')
        .order('created_at', { ascending: false });
    } catch (e) { r = { error: e }; }
    if (r.error) { K.err = cleanErr(r.error); K.errLoad = true; }
    else { K.orders = r.data || []; if (K.errLoad) { K.err = ''; K.errLoad = false; } }
    if (quiet) safeRender(); else render();
  }
  async function loadStock() {
    var r;
    try { r = await db.from('stock_status').select('*'); } catch (e) { r = { error: e }; }
    if (r.error) K.err = cleanErr(r.error); else K.stock = r.data || [];
    await loadTops();
    safeRender();
  }
  async function loadTops() {
    try {
      var c = await db.from('toppings').select('id,name,is_active,is_available,sort_order').order('sort_order');
      if (c.error) K.topsErr = true; else { K.tops = c.data || []; K.topsErr = false; }
    } catch (e) { K.topsErr = true; }
  }
  async function loadMenu() {
    var a, b;
    try {
      a = await db.from('menu_items').select('id,category_id,name,description,price,is_available,stock_qty,image_url,allow_topping,menu_categories(name)');
      b = await db.from('menu_categories').select('id,name,sort_order,has_topping').order('sort_order');
    } catch (e) { a = { error: e }; b = {}; }
    if (a.error || b.error) K.err = cleanErr(a.error || b.error);
    else { K.menu = a.data || []; K.cats = b.data || []; }
    await loadTops();
    safeRender();
  }
  async function loadStaff() {
    var r;
    try { r = await db.rpc('list_staff'); } catch (e) { r = { error: e }; }
    if (r.error) K.staffErr = true; else { K.staff = r.data || []; K.staffErr = false; }
    safeRender();
  }
  async function loadReport() {
    var t = todayStr(), rs;
    try {
      rs = await Promise.all([
        db.from('daily_sales').select('*').order('hari', { ascending: false }).limit(7),
        db.from('top_items_daily').select('*').eq('hari', t),
        db.from('sales_by_hour').select('*').eq('hari', t).order('jam'),
        db.from('monthly_sales').select('*').order('bulan', { ascending: false }).limit(6)
      ]);
    } catch (e) { K.err = cleanErr(e); return safeRender(); }
    var bad = rs.filter(function (x) { return x.error; })[0];
    if (bad) K.err = cleanErr(bad.error);

          n === 0 ? h('button', { class: 'b-del', disabled: K.busy, 'aria-label': 'Hapus kategori ' + c.name, onClick: function () { deleteCat(c); } }, 'Hapus')
                  : h('span', { class: 'small redup' }, 'Kosongkan dulu untuk menghapus'));
      })) : h('p', { class: 'redup' }, 'Belum ada kategori.'),
      h('h2', null, 'Topping'),
      K.topsErr ? h('p', { class: 'redup' }, 'Topping belum aktif. Jalankan file ea-dimsum-topping.sql di Supabase terlebih dahulu.')
      : h('div', { class: 'card lines' },
          K.tops.length ? K.tops.map(function (t) {
            return h('div', { class: 'row' },
              h('span', null, h('b', null, t.name), h('span', { class: 'redup' }, (t.is_active ? ' · tampil ke pelanggan' : ' · disembunyikan') + (t.is_available ? '' : ' · HABIS hari ini'))),
              h('span', { class: 'btns' },
                h('button', { class: 'b-out', disabled: K.busy, 'aria-label': (t.is_active ? 'Sembunyikan ' : 'Tampilkan ') + t.name, onClick: function () { toggleTopping(t); } }, t.is_active ? 'Sembunyikan' : 'Tampilkan'),
                h('button', { class: 'b-del', disabled: K.busy, 'aria-label': 'Hapus topping ' + t.name, onClick: function () { deleteTopping(t); } }, 'Hapus')));
          }) : h('p', { class: 'redup' }, 'Belum ada topping.'),
          h('div', { class: 'dash' },
            h('label', { class: 'lbl', for: 'nt-name' }, 'Tambah topping baru'),
            h('div', { class: 'sctl' },
              h('input', { type: 'text', id: 'nt-name', style: 'flex:1;min-width:160px;width:auto', maxlength: '40', placeholder: 'Contoh: Keju', value: K.newTop, onInput: function (e) { K.newTop = e.target.value; } }),
              h('button', { class: 'b-main', disabled: K.busy, onClick: addTopping }, 'Tambah topping'))),
          h('div', { class: 'small redup' }, 'Topping gratis. Pelanggan boleh memilih lebih dari satu atau tidak sama sekali.')),
      h('h2', null, 'Daftar menu'),
      K.menu.length ? h('div', { class: 'sgrid' }, K.menu.map(function (m) {
        var e = K.menuEdit[m.id] || {};
        return h('div', { class: 'card' },
          h('div', { class: 'mhead' },
            h('div', { class: 'mfoto', 'aria-hidden': 'true' }, m.image_url ? h('img', { src: m.image_url, alt: '' }) : '🥟'),
            h('div', { class: 'grow' },
              h('div', null, h('b', null, m.name)),
              h('div', { class: 'small redup' }, ((m.menu_categories && m.menu_categories.name) || '') + ' · stok ' + m.stock_qty),
              h('div', { class: 'btns', style: 'margin-top:6px' },
                h('label', { class: 'b-out', style: 'display:inline-flex;align-items:center;cursor:pointer' }, m.image_url ? 'Ganti foto' : 'Tambah foto',
                  h('input', { type: 'file', accept: 'image/*', class: 'file', id: 'ph-' + m.id, 'aria-label': 'Foto ' + m.name,
                    onChange: function (ev) { uploadPhoto(m, ev.target.files && ev.target.files[0]); } })),
                m.image_url ? h('button', { class: 'b-del', disabled: K.busy, onClick: function () { removePhoto(m); } }, 'Hapus foto') : null))),
          K.topsErr ? null : h('label', { class: 'small', style: 'display:flex;align-items:center;gap:8px;min-height:44px' },
            h('input', { type: 'checkbox', checked: m.allow_topping ? true : false, disabled: K.busy, id: 'tp-' + m.id, onChange: function () { toggleAllow(m); } }),
            'Boleh diberi topping'),
          h('div', { class: 'two' },
            h('div', null, h('label', { class: 'lbl', for: 'p-' + m.id }, 'Harga (Rp)'),
              h('input', { type: 'number', min: '0', inputmode: 'numeric', id: 'p-' + m.id, value: e.price !== undefined ? e.price : m.price, onInput: function (ev) { (K.menuEdit[m.id] = K.menuEdit[m.id] || {}).price = ev.target.value; } })),
            h('div', null, h('label', { class: 'lbl', for: 'd-' + m.id }, 'Keterangan'),
              h('input', { type: 'text', id: 'd-' + m.id, value: e.desc !== undefined ? e.desc : (m.description || ''), onInput: function (ev) { (K.menuEdit[m.id] = K.menuEdit[m.id] || {}).desc = ev.target.value; } }))),
          h('div', { class: 'btns' },
            h('button', { class: 'b-out', disabled: K.busy, onClick: function () { saveMenu(m); } }, 'Simpan'),
            h('button', { class: 'b-del', disabled: K.busy, 'aria-label': 'Hapus menu ' + m.name, onClick: function () { deleteMenu(m); } }, 'Hapus menu')));
      })) : h('p', { class: 'redup' }, 'Memuat menu...'));
  }

  // ---------- tampilan: pengaturan (admin) ----------
  var ROLES = [['admin', 'Admin'], ['kasir', 'Kasir'], ['dapur', 'Dapur']];
  function viewStaff() {
    var f = K.newStaff;
    return h('div', null,
      h('h2', { style: 'margin-top:4px' }, 'Pegawai'),
      K.staffErr ? h('p', { class: 'redup' }, 'Daftar pegawai belum aktif. Jalankan file ea-dimsum-pegawai.sql di Supabase terlebih dahulu.')
      : h('div', { class: 'card lines' },
          K.staff.length ? K.staff.map(function (s) {
            var me = s.id === K.uid;
            return h('div', { class: 'row', style: 'flex-wrap:wrap;opacity:' + (s.is_active ? 1 : .55) },
              h('span', null, h('b', null, s.full_name), me ? h('span', { class: 'redup' }, ' (Anda)') : null,
                h('div', { class: 'small redup' }, (s.email || '-') + (s.is_active ? '' : ' · nonaktif'))),
              h('span', { class: 'btns', style: 'align-items:center' },
                h('select', { style: 'width:auto', 'aria-label': 'Peran ' + s.full_name, disabled: K.busy || me, onChange: function (e) { changeStaff(s, e.target.value, s.is_active); } },
                  ROLES.map(function (r) { return h('option', { value: r[0], selected: s.role === r[0] }, r[1]); })),
                h('button', { class: s.is_active ? 'b-del' : 'b-out', disabled: K.busy || me, 'aria-label': (s.is_active ? 'Nonaktifkan ' : 'Aktifkan ') + s.full_name,
                  onClick: function () { changeStaff(s, s.role, !s.is_active); } }, s.is_active ? 'Nonaktifkan' : 'Aktifkan')));
          }) : h('p', { class: 'redup' }, 'Belum ada pegawai.'),
          h('div', { class: 'dash' },
            h('b', null, 'Tambah pegawai'),
            h('ol', { class: 'small redup', style: 'margin:6px 0 10px;padding-left:18px' },
              h('li', null, 'Buat akun login dulu di Supabase: Authentication, Users, Add user. Isi email dan kata sandi, lalu centang Auto Confirm User.'),
              h('li', null, 'Kembali ke sini, isi email yang sama, nama, dan peran, lalu tekan Tambah pegawai.')),
            h('div', { class: 'two' },
              h('div', null, h('label', { class: 'lbl', for: 'ns-email' }, 'Email akun'),
                h('input', { type: 'email', id: 'ns-email', autocomplete: 'off', value: f.email, onInput: function (e) { f.email = e.target.value; } })),
              h('div', null, h('label', { class: 'lbl', for: 'ns-name' }, 'Nama pegawai'),
                h('input', { type: 'text', id: 'ns-name', maxlength: '60', value: f.name, onInput: function (e) { f.name = e.target.value; } }))),
            h('div', null, h('label', { class: 'lbl', for: 'ns-role' }, 'Peran'),
              h('select', { id: 'ns-role', onChange: function (e) { f.role = e.target.value; } },
                ROLES.map(function (r) { return h('option', { value: r[0], selected: f.role === r[0] }, r[1]); }))),
            h('div', { class: 'btns', style: 'margin-top:10px' }, h('button', { class: 'b-main', disabled: K.busy, onClick: addStaff }, 'Tambah pegawai')),
            h('div', { class: 'small redup', style: 'margin-top:8px' }, 'Admin: semua fitur. Kasir dan Dapur: pesanan, jual langsung, stok, laporan, dan diskon, tanpa menu, pengaturan, dan hapus data. Lupa kata sandi: ubah di Supabase, Authentication, Users.'))));
  }
  function viewSettings() {
    return h('div', null,
      viewStaff(),
      h('h2', { style: 'margin-top:4px' }, 'Hapus data uji coba'),
      h('div', { class: 'card' },
        h('p', { style: 'margin:0' }, 'Gunakan ini sekali saja, setelah selesai mencoba aplikasi dan sebelum EA Dimsum berjualan sungguhan.'),
        h('div', { class: 'box small' },
          h('div', null, 'Yang dihapus: semua pesanan, struk, dan riwayat penjualan. Nomor antrean mulai lagi dari A-001.'),
          h('div', { style: 'margin-top:6px' }, 'Yang tetap ada: menu, kategori, harga, jumlah stok saat ini, dan akun staf. Periksa dan atur ulang stok di tab Stok.')),
        h('p', { class: 'small', style: 'margin:0;color:#A32A1F;font-weight:700' }, 'Data yang dihapus tidak bisa dikembalikan.'),
        h('div', null,
          h('label', { class: 'lbl', for: 'rst' }, 'Ketik HAPUS untuk melanjutkan'),
          h('input', { type: 'text', id: 'rst', autocomplete: 'off', autocapitalize: 'characters', value: '',
            onInput: function (e) { var b = document.getElementById('btn-reset'); if (b) b.disabled = K.busy || e.target.value.trim() !== 'HAPUS'; } })),
        h('div', { class: 'btns' }, h('button', { class: 'b-main', id: 'btn-reset', disabled: true, onClick: resetData }, 'Hapus semua data uji coba'))));
  }

  // ---------- mulai ----------
  async function init() {
    var r;
    try { r = await db.auth.getSession(); } catch (e) { r = {}; }
    if (r && r.data && r.data.session) await afterLogin(r.data.session.user);
    else { K.ready = true; render(); }
    db.auth.onAuthStateChange(function (ev) {
      if (ev === 'SIGNED_OUT' && K.profile) { teardown(); K.profile = null; K.orders = []; render(); }
    });
  }
  render();
  applyWallpaper();
  init();
})();
</script>
</body>
</html>
